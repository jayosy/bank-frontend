worker_processes 1;

pid "/Users/jayosy/Desktop/bank-front/.nginx/nginx.pid";
error_log "/Users/jayosy/Desktop/bank-front/.nginx/logs/error.log" info;

events {
    worker_connections 1024;
}

http {
    include "/opt/homebrew/etc/nginx/mime.types";
    default_type application/octet-stream;

    access_log "/Users/jayosy/Desktop/bank-front/.nginx/logs/access.log";

    sendfile on;

    client_body_temp_path "/Users/jayosy/Desktop/bank-front/.nginx/client_body_temp";
    proxy_temp_path "/Users/jayosy/Desktop/bank-front/.nginx/proxy_temp";

    server {
        listen 8086;
        server_name localhost 127.0.0.1;

        root "/Users/jayosy/Desktop/bank-front/dist/bank-front/browser";
        index index.html;

        location = /health {
            access_log off;
            default_type application/json;

            return 200 '{"status":"UP","service":"bank-front"}';
        }

        location /actuator/ {
            proxy_pass http://127.0.0.1:8081;

            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 3s;
            proxy_read_timeout 30s;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
