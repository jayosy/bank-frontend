server {
    listen 8080;

    server_name _;

    root /usr/share/nginx/html;

    index index.html;


    include /etc/nginx/snippets/security-headers.conf;


    autoindex off;

    proxy_hide_header X-Powered-By;


    #
    # Health frontend
    #

    location = /health {

        include /etc/nginx/snippets/security-headers.conf;

        add_header Cache-Control
            "no-store"
            always;

        default_type application/json;

        return 200 '{"status":"UP","service":"bank-front"}';
    }


    #
    # Version du déploiement
    #

    location = /version.json {

        include /etc/nginx/snippets/security-headers.conf;

        add_header Cache-Control
            "no-store"
            always;

        try_files /version.json =404;
    }


    #
    # index.html
    #
    # Toujours revérifier auprès du serveur.
    #

    location = /index.html {

        include /etc/nginx/snippets/security-headers.conf;

        add_header Cache-Control
            "no-cache, no-store, must-revalidate"
            always;

        add_header Pragma
            "no-cache"
            always;

        add_header Expires
            "0"
            always;

        try_files /index.html =404;
    }


    #
    # Bundles Angular hashés
    #
    # Ex:
    # main-Y5WMICVA.js
    # styles-F4HKKYG5.css
    #

    location ~* "^/.+-[A-Za-z0-9]{8,}\.(js|css)$"{

        include /etc/nginx/snippets/security-headers.conf;

        add_header Cache-Control
            "public, max-age=31536000, immutable"
            always;

        try_files $uri =404;
    }


    #
    # Assets classiques
    #

    location ~* "\.(?:png|jpg|jpeg|gif|svg|webp|ico|woff|woff2|ttf)$" {

        include /etc/nginx/snippets/security-headers.conf;

        add_header Cache-Control
            "public, max-age=86400"
            always;

        try_files $uri =404;
    }


    #
    # Backend API
    #

    location /api/ {

        proxy_pass http://bank-api:8080;

        proxy_http_version 1.1;

        proxy_set_header Host
            $host;

        proxy_set_header X-Real-IP
            $remote_addr;

        proxy_set_header X-Forwarded-For
            $proxy_add_x_forwarded_for;

        proxy_set_header X-Forwarded-Proto
            $scheme;

        proxy_connect_timeout 3s;

        proxy_send_timeout 30s;

        proxy_read_timeout 30s;

        proxy_buffering on;
    }


    #
    # Actuator backend
    #

    location /actuator/ {

        proxy_pass http://bank-api:8080;

        proxy_http_version 1.1;

        proxy_set_header Host
            $host;

        proxy_set_header X-Real-IP
            $remote_addr;

        proxy_set_header X-Forwarded-For
            $proxy_add_x_forwarded_for;

        proxy_set_header X-Forwarded-Proto
            $scheme;

        proxy_connect_timeout 3s;

        proxy_send_timeout 30s;

        proxy_read_timeout 30s;

        proxy_buffering on;
    }


    #
    # Angular SPA fallback
    #

    location / {

        try_files
            $uri
            $uri/
            /index.html;
    }
}